server:
  port: 8081

spring:
  application:
    name: mini-rtb-engine
  datasource:
    url: jdbc:mysql://127.0.0.1:13306/rtb_learning?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 16379
      database: 10
      connect-timeout: 2s
      timeout: 2s


mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.rtb.service.BidLogBuffer: DEBUG

